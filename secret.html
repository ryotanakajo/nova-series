<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA Series</title>

  <link rel="stylesheet" href="css/transition.css">
  <link rel="stylesheet" href="css/lightning.css">
  <link rel="stylesheet" href="css/font.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* ヘッダー */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: black;
      z-index: 2000;
    }


    /* header自体の余白はinnerに任せる */
    .header-inner {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    header img {
      height: 40px;
    }

    nav a {
      color: white;
      text-decoration: none;

      display: flex;
      align-items: center;
      justify-content: center;

      height: 100%;
      padding: 0 16px;

      margin-left: 0;
      /* ←くっつける */
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 0;

      font-size: 14px;
      letter-spacing: 0.15em;
      white-space: nowrap;
    }

    /* 境界を1本に */
    nav a+a {
      border-left: none;
    }

    /* 両端だけ丸める（任意） */
    nav a:first-child {
      border-radius: 4px 0 0 4px;
    }

    nav a:last-child {
      border-radius: 0 4px 4px 0;
    }

    nav a.characters {
      background: rgb(0, 0, 0);
    }

    nav a.world {
      background: rgb(0, 0, 0);
    }

    nav a.glossary {
      background: rgb(0, 0, 0);
    }

    nav a.Twitter {
      background: rgb(0, 0, 0);
    }

    nav a:hover {
      background: rgba(255, 255, 255, 0.1);
    }




    /* サイドバー（ヘッダーの下から出す：閉じられない問題を根絶） */
    .sidebar {
      position: fixed;
      top: 80px;
      /* ←ここ：ヘッダーの高さ分だけ下げる */
      left: -384px;
      width: 384px;
      height: calc(100vh - 80px);
      /* ←ここ：下げた分だけ高さを引く */
      background: black;
      padding: 20px;
      /* ←110pxはヘッダー避け用だったので不要 */
      box-sizing: border-box;
      z-index: 2000;
      /* ←ここ：ヘッダーより下に固定 */
      transition: left 0.3s ease;
    }

    .sidebar.active {
      left: 0;
    }

    .hamburger {
      /* buttonのデフォルト見た目を殺す */
      appearance: none;
      -webkit-appearance: none;

      background: transparent;
      /* ←白消える */
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;

      padding: 8px 10px;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;

      position: relative;
      /* ←これ超重要 */
      z-index: auto;
      position: relative;
      /* ←サイドバーより前 */
    }

    .hamburger:focus {
      outline: none;
    }

    /* Heroセクション */
    .hero-section {
      margin-left: 0px;
      background: black;
    }

    .slideshow {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      /* 縦長比率 */
      overflow: hidden;
    }

    .slide {
      display: block;
      width: 100%;
      height: auto;
      /* 2:3 の比率は画像そのもので担保 */
      opacity: 0;
      position: absolute;
      top: 0;
      left: 0;
      transition: opacity 1s ease-in-out;
    }

    .slide.active {
      opacity: 1;
      position: relative;
      /* 表示中のやつは通常フローに戻す */
    }

    .lightning {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 960px;
      margin: 0 auto;
      position: relative;
    }

    .grid-item {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid #999;
      padding: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .grid-item:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    /* ニュース */
    .news-section {
      margin-left: 0px;
      background: black;
      padding: 40px 0;
    }

    .news-section-inner {
      margin: 0 auto;
    }

    /* フッター */
    footer {
      margin-left: 0px;
      background: black;
      padding: 20px;
      text-align: center;
    }

    /*共通*/
    .vertical-text {
      position: absolute;
      top: 10%;
      right: 10%;
      writing-mode: vertical-rl;
      text-orientation: upright;
      color: white;
      font-size: 24px;
      font-weight: bold;
      z-index: 200;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .vertical-text.active {
      opacity: 1;
    }

    .highlight {
      color: red;
      font-weight: bold;
    }

    /* スマホ用 */
    @media screen and (max-width: 768px) {
      .sidebar {
        left: -100%;
        width: 70%;
        transition: left 0.3s ease;
        z-index: 2000;
      }

      .sidebar.active {
        left: 0;
      }

      .hero-section,
      .news-section,
      footer {
        margin-left: 0;
        width: 100%;
      }

      .grid-container {
        position: static;
        /* ← relative解除 */
        left: auto;
        /* ← left補正リセット */
        margin: 0 auto;
        /* ← 中央寄せ */
        width: 90%;
        /* ← 画面幅に合わせる（好みに応じて調整） */
        max-width: 100%;
        grid-template-columns: 1fr;
        /* ← スマホは1列表示推奨 */
      }

      .vertical-text {
        top: 5%;
        right: 5%;
        font-size: 18px;
      }
    }

    /* 1440基準の安全枠 */
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
    }

    #exitSecret {
      position: fixed;
      right: 20px;
      bottom: 20px;

      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;

      z-index: 9999;
    }
  </style>
</head>

<body>
  <script>
    // 認証済みじゃなければ index に戻す（自分に戻さない＝ループ防止）
    if (sessionStorage.getItem("secret_authed") !== "1") {
      location.replace("index.html");
    }
  </script>

  <!-- ページ遷移アニメーション -->
  <div class="page-transition top"></div>
  <div class="page-transition bottom"></div>

  <!-- ヘッダー -->
  <header>
    <div class="header-inner container">
      <button class="hamburger" type="button" aria-label="Open menu" onclick="toggleSidebar()">☰</button>

      <nav>
        <a href="characters.html" class="nav characters">NEWS</a>
        <a href="top_world.html" class="nav world">INFO</a>
        <a href="history.html" class="nav glossary">STORE</a>
        <a href="history.html" class="nav Twitter">Twitter</a>
      </nav>

      <div class="heder-left">nova-series.com</div>
    </div>
  </header>

  <!-- サイドバー -->
  <aside class="sidebar">
    <h2>Sidebar Menu</h2>
    <ul>
      <li>リンク1</li>
      <li>リンク2</li>
      <li>リンク3</li>
    </ul>
  </aside>

  <!-- Hero（スライドショー + 雷） -->
  <section class="hero-section">
    <div class="slideshow">
      <div class="floating-buttons">
        <a href="NOVAS.html" class="nav-button">-NOVAS-</a>
        <a href="NOVAX.html" class="nav-button">-NOVAX-</a>
      </div>
      <img src="images/novas1.avif" class="slide active">
      <img src="images/novas2.avif" class="slide">
      <img src="images/novas6.avif" class="slide">
      <div class="lightning"></div>
      <!-- セリフ群 -->

      <div class="vertical-text active">
        <p>「NOVA</p>
        <p class="highlight"> それが始まる物語」</p>

      </div>
      <div class="vertical-text">「誰も知らない戦いがある」</div>
      <div class="vertical-text">「未来は、君の手に」</div>
    </div>
  </section>

  <!-- ニュース -->
  <section class="news-section">
    <div class="news-section-inner">
      <h2>最新記事</h2>
      <article>
        <h3>サイト更新</h3>
        <p>背景とアニメーションを整理しました。</p>
      </article>
    </div>
  </section>

  <!-- フッター -->
  <footer>&copy; 2025 NOVA Series. All rights reserved.</footer>

  <!-- 共通アニメーションJS -->
  <script src="js/transition.js"></script>
  <script src="js/lightning.js"></script>

  <!-- 背景スライドショー -->
  <script>
    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('active');
    }

    const slides = document.querySelectorAll('.slideshow .slide');
    const texts = document.querySelectorAll('.slideshow .vertical-text');
    const max = Math.min(slides.length, texts.length);
    let index = 0;
    setInterval(() => {
      slides[index].classList.remove('active');
      texts[index].classList.remove('active');

      index = (index + 1) % max;

      slides[index].classList.add('active');
      texts[index].classList.add('active');
    }, 8000); // 8秒ごとに切替
  </Script>
  <button id="exitSecret">EXIT</button>
  <script>
    document.getElementById("exitSecret").addEventListener("click", () => {
      // 認証を消す（これ重要）
      sessionStorage.removeItem("secret_authed");

      // indexに戻す
      location.href = "index.html";
    });
  </script>
</body>

</html>
