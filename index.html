<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA Series</title>

  <!-- 外部アニメーションCSS -->
  <link rel="stylesheet" href="css/transition.css">

  <!-- index専用（雷アニメーション） -->
  <link rel="stylesheet" href="css/lightning.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* 背景 */
    .background-layer {
      position: absolute;
      top: 0;
      left: 384px;
      width: calc(100% - 384px);
      height: 100%;   
      background-size: cover;
      background-position: top center;
      z-index: -1;
    }

    /* ヘッダー */
    header {
      position: fixed;
      top: 0;
      left: 384px;
      width: calc(100% - 384px);
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between; /* ←左にロゴ、右にメニュー */
    }
    header img { height: 40px; }
    nav a { color: white; margin-left: 15px; text-decoration: none; }

    /* サイドバー */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 384px;
      height: 100vh;
      background: black;
      padding: 110px 20px 20px;
      box-sizing: border-box;
    }
    .sidebar.collapsible { display: none; }

    /* ハンバーガー */
    .hamburger {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 24px;
      cursor: pointer;
      z-index: 1500;
    }

    /* メイン */
    .main-content {
      margin-left: 384px;
      padding: 120px 20px;
      min-height: calc(100vh - 200px);
      box-sizing: border-box;
    }

    /* ニュース */
    .news-section {
      margin-left: 384px; /* ←サイドバーを避ける */
      background: rgba(0,0,0,0.85);
      padding: 40px 0;
    }
    .news-section-inner {
      width: 80%;
      margin: 0 auto;
    }

    /* フッター */
    footer {
      margin-left: 384px;
      background: black;
      padding: 20px;
      text-align: center;
    }

    /* スマホ対応 */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .hamburger { display: block; }
      .sidebar.collapsible {
        display: block;
        position: fixed;
        top: 0;
        left: -100%;
        width: 70%;
        height: 100vh;
        background: black;
        transition: left 0.3s ease;
      }
      .sidebar.collapsible.active { left: 0; }
      .main-content, .news-section, footer { margin-left: 0; padding-top: 60px; }
      header { left: 0; width: 100%; }
      .news-section-inner { width: 95%; }
    }
  </style>
</head>
<body>
  <!-- ページ遷移アニメーション -->
  <div class="page-transition top"></div>
  <div class="page-transition bottom"></div>

  <div class="background-layer"></div>
  <div class="lightning"></div>


  <!-- ヘッダー -->
  <header>
    <img src="images/nova_emblem_transparent.png" alt="Logo" />
    <nav>
      <a href="characters.html">Characters</a>
      <a href="top_world.html">World</a>
      <a href="glossary.html">Glossary</a>
    </nav>
  </header>

  <!-- ハンバーガー -->
  <div class="hamburger" onclick="toggleSidebar()">☰</div>

  <!-- サイドバー -->
  <aside class="sidebar">
    <h2>Sidebar Menu</h2>
    <ul>
      <li>リンク1</li>
      <li>リンク2</li>
      <li>リンク3</li>
    </ul>
  </aside>

  <!-- 折りたたみサイドバー -->
  <aside class="sidebar collapsible">
    <h2>Sidebar Menu</h2>
    <ul>
      <li>リンク1</li>
      <li>リンク2</li>
      <li>リンク3</li>
    </ul>
  </aside>

  <!-- メイン -->
  <div class="main-content">
    <!-- ここに本文 -->
  </div>

  <!-- ニュース -->
  <section class="news-section">
    <div class="news-section-inner">
      <h2>最新記事</h2>
      <article><h3>サイト更新</h3><p>背景とアニメーションを整理しました。</p></article>
    </div>
  </section>

  <!-- フッター -->
  <footer>&copy; 2025 NOVA Series. All rights reserved.</footer>

  <!-- 外部アニメーションJS -->
  <script src="js/transition.js"></script>

  <!-- index専用（雷アニメーション） -->
  <script src="js/lightning.js"></script>

  <!-- ページ用JS -->
  <script>
    function toggleSidebar() {
      document.querySelector('.sidebar.collapsible').classList.toggle('active');
    }

    // 背景スライドショー
    const images = ['images/novas1.avif','images/novas2.avif','images/novas6.avif'];
    let index = 0;
    const bg = document.querySelector('.background-layer');
    bg.style.backgroundImage = `url('${images[index]}')`;
    setInterval(() => {
      index = (index + 1) % images.length;
      bg.style.backgroundImage = `url('${images[index]}')`;
    }, 10000);
  </script>
</body>
</html>
