<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA Series</title>

  <link rel="stylesheet" href="css/transition.css">
  <link rel="stylesheet" href="css/lightning.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* ヘッダー */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header img { height: 40px; }
    nav a { color: white; margin-left: 15px; text-decoration: none; }

    /* サイドバー */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 384px;
      height: 100vh;
      background: black;
      padding: 110px 20px 20px;
      box-sizing: border-box;
      z-index: 900;
    }
    .hamburger { display: none; }

    /* Heroセクション */
    .hero-section {
      margin-left: 384px;
      background: black;
    }

    .slideshow {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3; /* 縦長比率 */
      overflow: hidden;
    }

    .slide {
      display: block;
      width: 100%;
      height: auto;         /* 2:3 の比率は画像そのもので担保 */
      opacity: 0;
      position: absolute;
      top: 0; left: 0;
      transition: opacity 1s ease-in-out;
    }
    
    .slide.active {
      opacity: 1;
      position: relative;   /* 表示中のやつは通常フローに戻す */
    }

    .lightning {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* グリッドセクション */
    .grid-section {
      margin-left: 384px;
      background: rgb(0, 0, 0);
      padding: 40px 0;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 960px;
      margin: 0 auto;
      position: relative; 
      left: 192px;
    }
    .grid-item {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid #999;
      padding: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .grid-item:hover { background-color: rgba(255, 255, 255, 0.25); }

    /* ニュース */
    .news-section {
      margin-left: 384px;
      background: black;
      padding: 40px 0;
    }
    .news-section-inner {
      width: 80%;
      margin: 0 auto;
    }

    /* フッター */
    footer {
      margin-left: 384px;
      background: black;
      padding: 20px;
      text-align: center;
    }

    /* スマホ用 */
    @media screen and (max-width: 768px) {
      .sidebar {
        left: -100%;
        width: 70%;
        transition: left 0.3s ease;
        z-index: 1000;
      }
      .sidebar.active { left: 0; }

      .hamburger {
        display: block;
        position: fixed;
        top: 20px;
        left: 20px;
        font-size: 24px;
        cursor: pointer;
        z-index: 1500;
      }

      .hero-section,
      .grid-section,
      .news-section,
      footer {
        margin-left: 0;
        width: 100%;
      }
      .grid-container {
        position: static;   /* ← relative解除 */
        left: auto;         /* ← left補正リセット */
        margin: 0 auto;     /* ← 中央寄せ */
        width: 90%;         /* ← 画面幅に合わせる（好みに応じて調整） */
        max-width: 100%;
        grid-template-columns: 1fr; /* ← スマホは1列表示推奨 */
      }
    }
  </style>
</head>
<body>
  <!-- ページ遷移アニメーション -->
  <div class="page-transition top"></div>
  <div class="page-transition bottom"></div>

  <!-- ヘッダー -->
  <header>
    <img src="images/nova_emblem_transparent.png" alt="Logo" />
    <nav>
      <a href="characters.html">Characters</a>
      <a href="top_world.html">World</a>
      <a href="glossary.html">Glossary</a>
    </nav>
  </header>

  <!-- ハンバーガー -->
  <div class="hamburger" onclick="toggleSidebar()">☰</div>

  <!-- サイドバー -->
  <aside class="sidebar">
    <h2>Sidebar Menu</h2>
    <ul>
      <li>リンク1</li>
      <li>リンク2</li>
      <li>リンク3</li>
    </ul>
  </aside>

  <!-- Hero（スライドショー + 雷） -->
  <section class="hero-section">
    <div class="slideshow">
      <img src="images/novas1.avif" class="slide active">
      <img src="images/novas2.avif" class="slide">
      <img src="images/novas6.avif" class="slide">
      <div class="lightning"></div>
    </div>
  </section>

  <!-- グリッド -->
  <section class="grid-section">
    <div class="grid-container">
      <a href="NOVAS.html" class="grid-item">-NOVAS-</a>
      <a href="NOVAX.html" class="grid-item">-NOVAX-</a>
    </div>
  </section>

  <!-- ニュース -->
  <section class="news-section">
    <div class="news-section-inner">
      <h2>最新記事</h2>
      <article>
        <h3>サイト更新</h3>
        <p>背景とアニメーションを整理しました。</p>
      </article>
    </div>
  </section>

  <!-- フッター -->
  <footer>&copy; 2025 NOVA Series. All rights reserved.</footer>

  <!-- 共通アニメーションJS -->
  <script src="js/transition.js"></script>
  <script src="js/lightning.js"></script>

  <!-- 背景スライドショー -->
  <script>
    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('active');
    }

    const slides = document.querySelectorAll('.slideshow .slide');
    let index = 0;
    setInterval(() => {
      slides[index].classList.remove('active');
      index = (index + 1) % slides.length;
      slides[index].classList.add('active');
    }, 8000); // 8秒ごとに切替
  </script>
</body>
</html>
