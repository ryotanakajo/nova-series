<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>World | NOVA Series</title>

  <!-- ページ遷移アニメーション -->
  <link rel="stylesheet" href="css/transition.css">

  <style>
    body {
      background: url('images/bg_stone_texture.jpg') repeat;
      background-size: 300px auto; /* 小さめに敷き詰めると高精細でも破綻しない */
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      background-color: rgba(0, 0, 0, 0.7);
    }
    header h1 {
      font-size: 1.5em;
      margin: 0;
    }
    nav a {
      color: #fff;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      color: #e63946;
    }
    .section {
      max-width: 1900px;
      margin: 20px auto;
      padding: 60px 40px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      height: 400px;
      box-sizing: border-box;
    }
    .section h2 {
      font-size: 2em;
      margin-bottom: 20px;
    }
    .section p {
      font-size: 1.1em;
      line-height: 1.8em;
    }
    .section.ishana {
      background: url('images/NOVAS.avif') center/cover no-repeat;
    }
    .section.nova1 {
      background: url('images/NOVAX.avif') center/cover no-repeat;
    }
    .section.empty {
      background-color: rgba(0, 0, 0, 0.5);
    }
    .subtitle {
      font-size: 0.7em;
      color: #ccc;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <!-- ページ遷移アニメーション用 -->
  <div class="page-transition top"></div>
  <div class="page-transition bottom"></div>
  <div class="background-layer"></div>

  <header>
    <h1>
      <a href="index.html" style="text-decoration: none; color: inherit;">NOVA Series</a>
    </h1>
  </header>

  <div class="section ishana" id="ishana-extra">
    <h2>
      NOVAS<br>
      <span class="subtitle">ーノヴァシリーズー</span>
    </h2>
    <ul>
      <li><a href="NOVAS.html">▶ 一覧</a></li>
    </ul>
  </div>

  <div class="section nova1" id="nova1">
    <h2>
      NOVAX<br>
      <span class="subtitle">―ノヴァクロス―</span>
    </h2>
    <ul>
      <li><a href="NOVAX.html">▶ 一覧</a></li>
    </ul>
  </div>
  <!-- 外部アニメーションJS -->
  <script src="js/transition.js"></script>
</body>
</html>
